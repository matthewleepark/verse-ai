<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a0b">
<title>verse-ai · Daily Verse</title>
<style>
  /* "The Fourth Watch": an engraving printed in darkness, lit by one light. */
  :root {
    --night: #0b0a0b;
    --charcoal: #141215;
    --bone: #efe6d2;
    --bone-soft: #d9cfbd;
    --bone-dim: #cbbd9f;
    --ash: #b9a98c;
    --muted: #a09382;
    --disabled: #8f8370;
    --gold: #d4a24c;
    --gold-hi: #f1d79a;
    --gold-lo: #9c7433;
    --crimson: #8a2a22;
    --crimson-text: #c25a4c;
    --crimson-wash: rgb(138 42 34 / 0.26);
    --gx: clamp(20px, 5.5vw, 104px);
    --gy: clamp(24px, 6.5vh, 72px);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--night); color: var(--bone); overflow: hidden; }
  body { font-family: "EB Garamond", Garamond, Georgia, serif; }
  ::selection { background: rgb(138 42 34 / 0.6); color: #fff6e6; }

  canvas, .fallback-img { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  canvas { cursor: crosshair; touch-action: none; }
  .fallback-img {
    object-fit: contain;
    object-position: 63% 100%;
    filter: grayscale(1) sepia(0.6) brightness(0.36) contrast(1.2);
    -webkit-mask-image: radial-gradient(60% 75% at 63% 62%, #000 45%, transparent 90%);
    mask-image: radial-gradient(60% 75% at 63% 62%, #000 45%, transparent 90%);
    display: none;
  }
  .static .fallback-img { display: block; }
  body.static::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 60% 35%, transparent 30%, rgb(7 6 7 / 0.85) 100%);
  }

  /* ---------- Top left: the date and the title word, like a film title ---------- */
  .heading {
    position: fixed;
    top: var(--gy);
    left: var(--gx);
    pointer-events: none;
    z-index: 2;
    isolation: isolate;
  }
  /* Invisible pools of shadow behind the title and the controls, so they read even in the rays. */
  .heading::before, .controls::before {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(closest-side, rgb(7 6 7 / 0.7), rgb(7 6 7 / 0.42) 60%, transparent);
  }
  .heading::before { inset: -40% -14% -40% -10%; }
  .controls::before { inset: -26px -44px; }
  .date {
    display: inline-flex;
    align-items: center;
    gap: 0.9em;
    font-size: clamp(13px, 0.95vw, 17px);
    font-variant-caps: all-small-caps;
    font-feature-settings: "onum";
    letter-spacing: 0.24em;
    color: var(--ash);
    text-shadow: 0 0 10px rgb(0 0 0 / 0.8);
  }
  .date::before { content: ""; width: 1.8em; height: 1px; background: var(--crimson); }
  .date .badge {
    font-size: 0.82em;
    letter-spacing: 0.2em;
    color: var(--gold);
    padding-bottom: 1px;
    border-bottom: 1px solid rgb(212 162 76 / 0.6);
  }
  .title {
    --tw: 1;
    margin-top: 0.2em;
    margin-right: -0.26em;
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: calc(clamp(40px, 5.2vw, 104px) * var(--tw));
    line-height: 1;
    letter-spacing: 0.26em;
    white-space: nowrap;
    color: #d9b46a;
    filter: drop-shadow(0 0 18px rgb(212 162 76 / 0.2)) drop-shadow(0 2px 2px rgb(0 0 0 / 0.6));
  }
  /* Gold leaf, per letter (on the parent it garbles the letter-by-letter reveal). */
  .title .ch {
    display: inline-block;
    /* Extra painted room so overhangs and descenders (the tail of J, Q, R) get gilded too. */
    padding: 0.06em 0.16em 0.24em;
    margin: -0.06em -0.16em -0.24em;
    background: linear-gradient(180deg, #f1d79a 0%, #d4a24c 58%, #9c7433 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .title .ch { -webkit-text-fill-color: currentColor; background: none; }
  }
  .title::after {
    content: "";
    display: block;
    width: min(34%, 300px);
    height: 1px;
    margin-top: 0.24em;
    background: linear-gradient(90deg, var(--crimson) 0 28px, var(--gold) 28px, transparent);
  }

  /* ---------- Top right: a quiet row of text controls ---------- */
  .controls {
    position: fixed;
    top: calc(var(--gy) - 10px);
    right: calc(var(--gx) - 14px);
    display: flex;
    gap: 2px;
    z-index: 6;               /* stays clickable above the Context drawer */
    isolation: isolate;
  }
  .controls button {
    font-family: "EB Garamond", Garamond, Georgia, serif;
    font-size: clamp(15px, 1.05vw, 19px);
    font-variant-caps: all-small-caps;
    letter-spacing: 0.16em;
    min-width: 44px;
    min-height: 48px;
    padding: 6px 14px;
    color: var(--bone-dim);
    background-color: transparent;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0 1px;
    background-position: 50% calc(100% - 10px);
    background-repeat: no-repeat;
    border: 0;
    border-radius: 0;
    outline: 0;
    box-shadow: none;
    text-shadow: 0 0 12px #000, 0 0 3px #000;
    cursor: pointer;
    transition: background-size 0.3s ease, color 0.2s ease;
  }
  .controls button:hover { color: var(--gold-hi); background-size: 1.4em 1px; }
  .controls button:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; color: var(--gold-hi); }
  .controls button:active { color: var(--gold); }
  .controls button:disabled { color: var(--disabled); cursor: default; background-size: 0 1px; }
  .controls button[aria-pressed="true"], .controls button[aria-expanded="true"] {
    color: var(--gold);
    background-image: linear-gradient(var(--crimson), var(--crimson));
    background-size: 1.4em 1px;
  }
  .controls .arrow { font-weight: 500; font-size: 1.4em; line-height: 0; color: var(--bone); }
  .controls button:disabled .arrow { color: inherit; }
  .controls .nav-label { font-size: 0.92em; margin: 0 0.45em; }

  /* Share menu */
  .share { position: relative; }
  .menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: rgb(20 18 21 / 0.96);
    border: 1px solid rgb(212 162 76 / 0.28);
    box-shadow: 0 18px 48px rgb(0 0 0 / 0.6);
    z-index: 6;
    animation: menu-in 0.16s ease;
  }
  @keyframes menu-in { from { opacity: 0; } }
  .menu[hidden] { display: none; }
  .menu button {
    white-space: nowrap;
    min-height: 48px;
    padding: 0 18px;
    text-align: left;
    background-image: none;
    text-shadow: none;
  }
  .menu button:hover, .menu button:focus-visible { color: var(--gold-hi); box-shadow: inset 2px 0 0 var(--crimson); outline: 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: clamp(24px, 6vh, 64px);
    transform: translate(-50%, 16px);
    font-size: clamp(15px, 1.05vw, 19px);
    font-variant-caps: all-small-caps;
    letter-spacing: 0.08em;
    background: var(--charcoal);
    color: var(--bone);
    border: 1px solid rgb(212 162 76 / 0.4);
    border-top-color: var(--gold);
    padding: 10px 22px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 7;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Outgoing copies of the title and caption during a transition. */
  .ghost { pointer-events: none !important; z-index: 2; }
  @media (max-width: 1100px) { .controls .nav-label { display: none; } }

  /* ---------- The verse: set directly on the dark sea, the hero of the page ---------- */
  .caption {
    --ts: 1;
    position: fixed;
    left: var(--gx);
    bottom: clamp(36px, 10vh, 120px);
    /* Stop short of Jesus' robe: the figure is centred at 63vw and is about 1.008 × 84vh wide,
       so its robe starts near 63vw - 38.3vh. */
    width: max(28vw, min(38vw, 44rem, calc(63vw - 38.3vh - var(--gx) - 28px)));
    isolation: isolate;
    z-index: 2;
  }
  /* An invisible pool of shadow behind the words, so they stay readable over any light. */
  .caption::before {
    content: "";
    position: absolute;
    inset: -22% -24% -26% -18%;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(closest-side, rgb(7 6 7 / 0.78), rgb(7 6 7 / 0.5) 55%, transparent);
  }
  @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 13/10) {
    .caption::before { background: radial-gradient(closest-side, rgb(7 6 7 / 0.85), rgb(7 6 7 / 0.55) 55%, transparent); }
  }
  .caption .text {
    display: flow-root;
    font-size: calc(clamp(21px, 0.9rem + 1.45vw, 44px) * var(--ts));
    line-height: 1.44;
    letter-spacing: 0.003em;
    color: var(--bone);
    font-feature-settings: "kern", "liga", "onum";
    text-wrap: pretty;
    text-shadow: 0 1px 2px rgb(0 0 0 / 0.7), 0 0 28px rgb(0 0 0 / 0.55);
  }
  /* A gold initial, as if lit by the light behind Jesus. It's a real span (not ::first-letter,
     which would swallow an opening quotation mark into the initial). */
  .caption .text .initial {
    float: left;
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 3em;
    line-height: 0.8;
    margin: 0.06em 0.12em 0 -0.02em;
    color: var(--gold);
    text-shadow: 0 0 22px rgb(212 162 76 / 0.35);
  }
  /* An opening quotation mark hangs in the margin, so the initial keeps its usual indent. */
  .caption .text { position: relative; }
  .caption .text .q {
    position: absolute;
    left: -0.5em;
    top: 0;
    color: var(--gold-lo);
  }
  .caption .ref {
    display: flex;
    align-items: center;
    gap: 0.9em;
    clear: both;
    margin-top: 1.1em;
    /* The reference never grows with a short verse, and never shrinks below legible. */
    font-size: max(12px, calc(clamp(14px, 1vw, 18px) * min(var(--ts), 1)));
    font-variant-caps: all-small-caps;
    font-feature-settings: "onum";
    letter-spacing: 0.26em;
    color: var(--gold);
    text-shadow: 0 0 10px rgb(0 0 0 / 0.8);
  }
  .caption .ref::before { content: ""; flex: none; width: 2.2em; height: 1px; background: var(--crimson); }

  .hint, .credit {
    position: fixed;
    right: var(--gx);
    font-variant-caps: all-small-caps;
    color: var(--muted);
    text-shadow: 0 0 8px rgb(0 0 0 / 0.9);
    pointer-events: none;
  }
  .hint {
    bottom: calc(clamp(10px, 1.6vh, 20px) + 24px);
    font-size: 13px;
    letter-spacing: 0.1em;
    transition: opacity 1.2s ease;
  }
  .hint.gone, .drawer.open ~ .hint { opacity: 0; }
  .credit { bottom: clamp(10px, 1.6vh, 20px); font-size: 13px; letter-spacing: 0.06em; }

  /* ---------- Context drawer ---------- */
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(520px, 92vw);
    overflow-y: auto;
    background: rgb(14 12 13 / 0.96);
    border-left: 1px solid rgb(212 162 76 / 0.22);
    box-shadow: -24px 0 60px rgb(0 0 0 / 0.55);
    scrollbar-color: rgb(212 162 76 / 0.35) transparent;
    /* The top is left free so the day and Share buttons stay usable while it's open. */
    padding: 0 36px 44px;
    font-size: 18px;
    line-height: 1.65;
    color: var(--bone-soft);
    transform: translateX(105%);
    transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
    z-index: 5;
  }
  .drawer.open { transform: none; }
  /* A solid band at the top of the drawer that stays put while it scrolls, so the text
     slides away under it instead of running behind the day and Share buttons above. */
  .drawer::before {
    content: "";
    position: sticky;
    top: 0;
    z-index: 1;
    display: block;
    height: calc(var(--gy) + 74px);
    margin: 0 -36px;
    background: linear-gradient(rgb(14 12 13), rgb(14 12 13) 78%, rgb(14 12 13 / 0));
    pointer-events: none;
  }
  .drawer .label { font-variant-caps: all-small-caps; letter-spacing: 0.22em; color: var(--gold); font-size: 17px; }
  .drawer h2 {
    font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.05;
    margin: 2px 0 10px;
    color: var(--gold-hi);
  }
  .drawer h3 {
    font-weight: 400;
    font-size: 15px;
    font-variant-caps: all-small-caps;
    letter-spacing: 0.22em;
    color: var(--gold);
    margin: 26px 0 6px;
    display: flex;
    align-items: center;
    gap: 0.8em;
  }
  .drawer h3::after { content: ""; flex: 1; height: 1px; background: rgb(212 162 76 / 0.3); }
  .drawer .num { font-size: 0.68em; color: var(--crimson-text); vertical-align: super; margin-right: 0.2em; }
  .drawer .here { color: #f4ead3; background: var(--crimson-wash); box-shadow: 0 0 0 2px rgb(138 42 34 / 0.26); }
  .drawer .close {
    position: absolute;
    top: calc(var(--gy) + 80px);
    right: 24px;
    width: 46px;
    height: 46px;
    font-family: "EB Garamond", Georgia, serif;
    font-size: 28px;
    line-height: 1;
    color: var(--bone-dim);
    background: transparent;
    border: 1px solid rgb(212 162 76 / 0.35);
    border-radius: 0;
    cursor: pointer;
  }
  .drawer .close:hover, .drawer .close:focus-visible { color: var(--gold-hi); border-color: var(--gold); background: rgb(212 162 76 / 0.08); outline: 0; }

  /* Phones and narrow windows: controls in a row across the top, then the title,
     with the verse across the bottom. This block must stay after the desktop rules. */
  @media (max-aspect-ratio: 1/1), (max-width: 700px) {
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 170px;
      background: linear-gradient(rgb(7 6 7 / 0.6), transparent);
      pointer-events: none;
      z-index: 1;
    }
    .controls {
      left: 8px;
      right: 8px;
      top: 10px;
      display: grid;
      grid-template-columns: 0.8fr 1.3fr 0.8fr 1.5fr 1.3fr;
      gap: 2px;
    }
    .controls button { min-width: 0; min-height: 48px; padding: 4px 2px; font-size: clamp(14px, 3.9vw, 18px); letter-spacing: 0.08em; }
    .controls .nav-label { display: none; }
    .share > button { width: 100%; }
    .heading { top: 76px; left: 20px; right: 20px; }
    .title { font-size: calc(clamp(34px, 10.5vw, 72px) * var(--tw)); letter-spacing: 0.2em; margin-right: -0.2em; }
    .caption { width: auto; left: 20px; right: 20px; bottom: calc(40px + env(safe-area-inset-bottom)); }
    .caption::before { inset: -18% -10% -14% -10%; }
    .caption .text { font-size: calc(clamp(19px, 5.2vw, 24px) * var(--ts)); line-height: 1.45; }
    .hint { display: none; }
    .credit { right: 0; left: 0; bottom: 6px; text-align: center; font-size: 12px; }
    .controls::before { display: none; }          /* the top gradient already covers them */
    .date { color: var(--bone-dim); text-shadow: 0 0 12px #000, 0 0 3px #000; }
  }

  /* People who prefer less motion get instant UI changes (verse changes become short fades). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<img class="fallback-img" id="fallbackImg" alt="">
<canvas id="scene" aria-label="A night sea at the fourth watch: a woodcut of Jesus catching Peter, lit by a single soft light. Click the water to make ripples."></canvas>

<header class="heading">
  <div class="date" id="date"></div>
  <h1 class="title" id="title"></h1>
</header>

<nav class="controls" aria-label="Choose a day">
  <button id="prev"><span class="arrow" aria-hidden="true">‹</span><span class="nav-label" id="prevLabel"></span></button>
  <button id="today" title="Back to today's verse (T)">Today</button>
  <button id="next"><span class="nav-label" id="nextLabel"></span><span class="arrow" aria-hidden="true">›</span></button>
  <button id="contextBtn" title="Context for this verse (C)" aria-pressed="false">Context</button>
  <div class="share">
    <button id="shareBtn" title="Share this verse" aria-haspopup="menu" aria-expanded="false">Share</button>
    <div class="menu" id="shareMenu" role="menu" hidden>
      <button role="menuitem" id="copyVerse">Copy verse</button>
      <button role="menuitem" id="saveImage">Save image</button>
      <button role="menuitem" id="nativeShare" hidden>Share…</button>
    </div>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<section class="caption" id="caption" aria-live="polite">
  <p class="text" id="verseText"></p>
  <div class="ref" id="verseRef"></div>
</section>

<aside class="drawer" id="drawer" aria-label="Context for this verse">
  <button class="close" id="closeDrawer" title="Close (Esc)" aria-label="Close">×</button>
  <div class="label">Context</div>
  <div id="drawerBody"></div>
</aside>

<p class="hint" id="hint">Touch the water · Arrow keys change the day · C for context · Space pauses</p>
<p class="credit">Art: Julius Schnorr von Carolsfeld, 1860 (public domain) · <span id="translation"></span></p>

<script>
// visual.py replaces the next line with the verses, the artwork and the fonts.
const DATA = /*__VERSE_DATA__*/null;

// Outline around Jesus, Peter and the boat (fractions of the artwork's width/height).
// Only this part of the woodcut is shown; the sea and sky around it are drawn live.
const FIGURE = [
  [0.210, 0.198], [0.280, 0.144], [0.305, 0.102], [0.350, 0.066], [0.415, 0.051], [0.4525, 0.072],
  [0.4575, 0.138], [0.4675, 0.198], [0.500, 0.246], [0.560, 0.228], [0.550, 0.000], [0.645, 0.000],
  [0.6725, 0.138], [0.735, 0.162], [0.850, 0.135], [0.885, 0.180], [1.000, 0.252],
  [1.000, 0.540], [0.990, 0.600], [0.980, 0.780], [0.800, 0.792], [0.675, 0.780], [0.640, 0.888],
  [0.575, 0.912], [0.450, 0.900], [0.400, 0.936], [0.380, 0.984], [0.280, 1.000], [0.180, 1.000],
  [0.140, 0.936], [0.125, 0.768], [0.120, 0.600], [0.100, 0.432], [0.130, 0.372],
];
const ART_HORIZON = 0.25;          // where the sea meets the sky inside the woodcut
const JESUS_HEAD = [0.40, 0.09];   // centre of the light rays, in artwork coordinates
const MAX_RIPPLES = 12;
const TRAVEL_MS = 1400;            // how long the scene glides when moving between verses
// Testing switches: ?nograin  ?t=SECONDS (freeze time)  ?ripple=X,Y (screen fractions)  ?panel  ?lowres
const PARAMS = new URLSearchParams(location.search);

const VERTEX = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = vec2(aPos.x + 1.0, 1.0 - aPos.y) * 0.5;   // 0..1, y pointing down
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FRAGMENT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uImage, uMask;
uniform vec2 uRes;            // canvas size in pixels
uniform vec4 uFig;            // where the woodcut sits on screen: x, y, width, height (fractions)
uniform vec2 uSun;            // Jesus' head on screen (fractions)
uniform float uTime, uHorizon, uGrain, uDpr;
uniform vec4 uRipples[${MAX_RIPPLES}];   // x, y (screen fractions), start time, strength
// Moving between verses: uTravel slides the scene (nearer layers move more),
// uPulse rises and falls during a transition, uProgress runs 0..1, uDir is +1 / -1,
// and uMood (0..1, one value per verse) sets how stormy the sky is.
uniform float uTravel, uPulse, uProgress, uDir, uMood;

const vec3 GOLD = vec3(0.84, 0.66, 0.30);
const vec3 NIGHT = vec3(0.027, 0.024, 0.027);     // engraved line ink
const vec3 BONE = vec3(0.937, 0.902, 0.824);      // the woodcut's lit paper
const vec3 EMBER = vec3(0.42, 0.11, 0.09);        // crimson-umber dusk band
const vec3 AMBER = vec3(0.86, 0.56, 0.24);        // horizon, light on the water, lens streak
const vec3 HALO = vec3(1.0, 0.82, 0.52);          // the light behind Jesus
const int ROWS = 16;

float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}

// Engraving: parallel lines along coordPx (pixels), spaced gapPx apart. Darker tones
// are made by thicker lines, as in a steel engraving. Returns ink coverage 0..1.
float engrave(float coordPx, float gapPx, float darkness) {
  float d = abs(fract(coordPx / gapPx) - 0.5) * gapPx;
  float halfWidth = clamp(darkness, 0.0, 1.0) * gapPx * 0.48;
  return 1.0 - smoothstep(halfWidth - 0.7, halfWidth + 0.7, d);
}

// Wave row i: crest height (screen y) at p.x, plus the phase used for shading.
void waveRow(int i, float px, float t, out float crest, out float u, out float amp, out float spacing) {
  float fi = float(i);
  float k = (fi + 1.0) / float(ROWS);
  float k2 = (fi + 2.0) / float(ROWS);
  float span = 1.0 - uHorizon;
  float base = uHorizon + span * pow(k, 1.55);
  spacing = span * (pow(k2, 1.55) - pow(k, 1.55));
  amp = 0.004 + 0.05 * pow(k, 1.6);
  float freq = mix(55.0, 6.0, pow(k, 0.7));
  float dir = mod(fi, 2.0) < 1.0 ? 1.0 : -0.6;
  u = px * freq + hash1(fi) * 6.2831 + t * dir * mix(0.35, 0.9, k)
    + uTravel * mix(1.2, 5.0, k);                    // parallax: near rows slide farther
  // Long rounded swells with softly pointed crests.
  crest = base - amp * pow(0.5 + 0.5 * sin(u), 1.6)
               - amp * 0.25 * sin(u * 0.47 + fi + t * 0.3)
               + 0.003 * k * sin(t * 0.8 + fi);
}

void main() {
  float aspect = uRes.x / uRes.y;
  float pxSize = 1.0 / uRes.y;                       // one pixel, in screen-height units
  vec2 uv = vUv;
  vec2 p = vec2(uv.x * aspect, uv.y);
  vec2 frag = gl_FragCoord.xy;
  float t = uTime;
  float ink = 0.0;     // engraved ink, 0..1
  float light = 0.0;   // warm golden light, 0..1

  vec2 sun = vec2(uSun.x * aspect, uSun.y);
  float sunDist = length(p - sun);
  // Tighter glows on tall phone screens, so the small sky stays dark gold, never cream.
  float pk = mix(1.7, 1.0, smoothstep(0.8, 1.3, aspect));
  float breath = 1.0 + 0.04 * sin(t * 0.5);          // the halo breathes; still when time is frozen

  if (uv.y < uHorizon) {
    // ---------- Sky: horizontal engraved lines, heavier at the top ----------
    float h = uv.y / uHorizon;
    float dark = mix(mix(0.40, 0.62, uMood), 0.08, smoothstep(0.0, 1.0, h));

    // Clouds: lighter tops, shaded undersides, drifting slowly.
    vec2 cp = p * vec2(1.4, 3.0) + vec2(t * 0.006 + uTravel * 0.45, 0.0);
    float c = fbm(cp);
    float level = mix(0.58, 0.50, uMood);            // stormier verses get more cloud
    float zone = 1.0 - smoothstep(0.6, 1.0, h);
    float cloud = smoothstep(level, level + 0.05, c) * zone;
    float under = smoothstep(0.0, 0.08, fbm(cp + vec2(0.0, 0.22)) - c);
    dark = mix(dark, mix(0.04, 0.55, under), cloud);

    // Light from behind Jesus: rays and a glow that clear away the lines.
    vec2 dv = p - sun;
    float ang = atan(dv.y, dv.x);
    float ray = smoothstep(0.35, 0.7, 0.5 + 0.5 * sin(ang * 18.0 + uTravel * 0.4 + t * 0.02));
    float reach = 1.0 - smoothstep(0.05, 1.0, sunDist);
    dark *= 1.0 - ray * reach * 0.5;
    float glow = 1.0 - smoothstep(0.0, 0.35, sunDist);
    dark *= 1.0 - glow;
    light = max(light, glow * 0.85 + ray * reach * 0.3);

    float coord = frag.y + sin(frag.x * 0.004 + h * 3.0) * 2.0 * uDpr;
    ink = engrave(coord, mix(3.2, 4.6, h) * uDpr, dark);
  } else {
    // ---------- Sea: rows of engraved swells, nearer rows drawn over farther ones ----------
    int cur = -1;
    float curCrest = 0.0, curU = 0.0, curAmp = 0.0, curSpacing = 1.0;
    for (int i = 0; i < ROWS; i++) {
      float crest, u, amp, spacing;
      waveRow(i, p.x, t, crest, u, amp, spacing);
      if (uv.y > crest) { cur = i; curCrest = crest; curU = u; curAmp = amp; curSpacing = spacing; }
    }
    if (cur < 0) {
      ink = engrave(frag.y, 2.6 * uDpr, 0.3);        // the calm strip just below the horizon
    } else {
      float k = (float(cur) + 1.0) / float(ROWS);
      float d = uv.y - curCrest;
      float dpx = d / pxSize;
      float dn = d / (curSpacing + curAmp * 0.6);
      float gap = mix(2.6, 5.5, k) * uDpr;
      float lineW = mix(0.8, 2.2, k) * uDpr;
      float foam = 0.06 + 0.22 * pow(0.5 + 0.5 * sin(curU), 6.0);
      if (dpx < lineW) {
        ink = 1.0;                                    // the crest's outline
      } else if (dn < foam) {
        ink = engrave(dpx, gap, 0.04);                // bright foam along the crest
      } else {
        float body = smoothstep(foam, 1.0, dn);
        float darkness = mix(0.12, 0.78, body) * mix(0.55, 1.0, k);
        ink = engrave(dpx, gap, darkness);            // lines follow the wave
        if (darkness > 0.55) {                        // cross-hatching in the deepest troughs
          ink = max(ink, engrave((frag.x + frag.y) * 0.7071, gap * 1.25, (darkness - 0.55) * 1.4));
        }
      }
      // A path of sunlight glinting on the water beneath Jesus.
      float q = (uv.x - uSun.x) * aspect * 3.5;
      float glint = smoothstep(0.55, 1.0, 0.5 + 0.5 * sin(curU * 3.0 + t * 0.8));
      light = max(light, exp(-q * q) * (1.0 - smoothstep(0.0, 0.45, uv.y - uHorizon)) * glint * 0.55);
    }
  }

  // ---------- Ripples from clicks and the mouse: fine engraved rings ----------
  for (int i = 0; i < ${MAX_RIPPLES}; i++) {
    vec4 r = uRipples[i];
    float age = uTime - r.z;
    if (r.w <= 0.0 || age < 0.0 || age > 4.0 || r.y <= uHorizon) continue;
    vec2 dv = p - vec2(r.x * aspect, r.y);
    dv.y *= 3.2;                                      // flattened rings: water seen at an angle
    float dist = length(dv);
    float fade = 1.0 - age / 4.0;
    for (int n = 0; n < 4; n++) {
      float rad = age * 0.16 * r.w - float(n) * 0.035;
      if (rad <= 0.0) continue;
      float thick = (1.3 * fade * r.w + 0.5) * pxSize * uDpr;
      if (abs(dist - rad) < thick) ink = mix(ink, 1.0, fade);
      else if (dist < rad - thick && dist > rad - 0.012) { ink *= 1.0 - 0.8 * fade; light = max(light, 0.3 * fade * r.w); }
    }
  }

  // ---------- The night: the engraving prints onto a field of light that exists only near the halo ----------
  float hz = uHorizon, dh = uv.y - hz, sx = abs(p.x - sun.x);
  vec3 L = mix(vec3(0.020, 0.022, 0.028), vec3(0.060, 0.052, 0.054), smoothstep(0.0, hz, uv.y));
  float band = exp(-abs(dh) / (dh < 0.0 ? 0.09 : 0.05)) * mix(1.0, 0.55, uMood);
  L += EMBER * band * 0.38 * (0.55 + 0.45 * exp(-sx * 0.9));                           // crimson dusk band
  L += AMBER * exp(-abs(dh) / 0.022) * exp(-sx * 1.4) * 0.75 * mix(1.0, 0.6, uMood);   // the hot horizon line
  L += (HALO * exp(-sunDist * 5.5 * pk) * 0.95 + AMBER * exp(-sunDist * 2.6 * pk) * 0.10) * breath;
  if (dh > 0.0) {                                                                      // a path of light on the water
    float q = (p.x - sun.x) * 2.6;
    L += AMBER * exp(-q * q) * exp(-dh * 1.6) * 0.70;
  }
  L *= mix(0.85, 1.12, fbm(vUv * vec2(aspect, 1.0) * 2.2 + vec2(t * 0.01, 0.0) + 11.0)); // slow haze: never flat black
  vec3 col = mix(L, NIGHT, clamp(ink, 0.0, 1.0) * 0.93);
  col += HALO * clamp(light, 0.0, 1.0) * 0.10;

  // ---------- The woodcut figures, cut out with the outline ----------
  vec2 iuv = (vUv - uFig.xy) / uFig.zw;
  if (all(greaterThanEqual(iuv, vec2(0.0))) && all(lessThanEqual(iuv, vec2(1.0)))) {
    float m = texture(uMask, iuv).r;
    // Fade where the woodcut's own border cuts through the boat and mast.
    m *= 1.0 - smoothstep(0.86, 0.995, iuv.x);
    m *= smoothstep(0.0, 0.08, iuv.y);
    float lum = dot(texture(uImage, iuv).rgb, vec3(0.299, 0.587, 0.114));
    float s = smoothstep(0.1, 0.85, lum);                                    // paper = 1, ink = 0
    // Lit from the halo down: Jesus and Peter in light, the boat in mid-tone, the feet in night.
    float lit = (0.07 + mix(0.60, 0.86, smoothstep(0.8, 1.3, aspect)) * exp(-sunDist * 2.7 * pk)) * breath;
    vec3 paper = BONE * lit * vec3(1.0, 0.94, 0.84) + AMBER * 0.10 * lit;
    vec3 art = mix(NIGHT, paper, s);
    // Near the cut edge the woodcut only darkens (its lines print, its paper never brightens),
    // so there's no pale halo or box around the figures.
    vec3 overprint = min(col, col * mix(0.10, 1.0, s));
    vec3 blended = mix(overprint, art, smoothstep(0.60, 1.0, m));
    col = mix(col, blended, smoothstep(0.0, 0.3, m));
  }

  // ---------- Lens: a soft bloom and one thin anamorphic streak through the halo ----------
  col += HALO * exp(-sunDist * 9.0) * 0.22 * breath;
  float sy = (p.y - sun.y) / 0.006;
  col += AMBER * exp(-sy * sy) * exp(-abs(p.x - sun.x) * 2.2) * 0.10;

  // ---------- Moving between verses: the exposure breathes down as amber light crosses the lens ----------
  if (uPulse > 0.001) {
    float sweepX = uDir > 0.0 ? mix(-0.25, 1.25, uProgress) : mix(1.25, -0.25, uProgress);
    float sw = (vUv.x - sweepX) / 0.22;
    col *= 1.0 - uPulse * 0.18;
    col += AMBER * exp(-sw * sw) * uPulse * 0.10;
  }

  // Static film grain (stronger in the shadows) and a deep vignette biased toward the light.
  col += (hash(floor(gl_FragCoord.xy / uDpr)) - 0.5) * 0.028 * uGrain * (0.5 + 0.5 * (1.0 - dot(col, vec3(0.333))));
  float v = length((vUv - vec2(mix(0.5, uSun.x, 0.4), 0.45)) * vec2(1.0, 1.15));
  col *= 1.0 - smoothstep(0.38, 0.98, v) * 0.70;
  outColor = vec4(col, 1.0);
}`;

const $ = (id) => document.getElementById(id);
const DAY_MS = 86400000;
const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// ---------- Which verse is showing ----------

let offset = 0;   // days away from the day the page was opened for

function verseFor(offsetDays) {
  // The opening day may be a custom verse (--ref, --theme, --shuffle).
  if (offsetDays === 0) return DATA.start;
  const list = DATA.daily;
  const i = (((DATA.startOrdinal + offsetDays) % list.length) + list.length) % list.length;
  return list[i];
}

// The real date (from this computer's clock, so it stays right past midnight), as an
// offset from the day the page was built for. Browsing never changes this.
function localIsoToday() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}
const todayOffset = () => offsetForIso(localIsoToday());

function dayFor(offsetDays) {
  const [y, m, d] = DATA.startDate.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d) + offsetDays * DAY_MS);
}

function dateText(offsetDays) {
  const day = dayFor(offsetDays);
  return `${WEEKDAYS[day.getUTCDay()]}, ${MONTHS[day.getUTCMonth()]} ${day.getUTCDate()}, ${day.getUTCFullYear()}`;
}

function shortDate(offsetDays) {
  const day = dayFor(offsetDays);
  return `${MONTHS[day.getUTCMonth()].slice(0, 3)} ${day.getUTCDate()}`;
}

const isoDate = (offsetDays) => dayFor(offsetDays).toISOString().slice(0, 10);

function offsetForIso(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const [sy, sm, sd] = DATA.startDate.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(sy, sm - 1, sd)) / DAY_MS);
}

function fillText() {
  const verse = verseFor(offset);
  $("date").textContent = dateText(offset);
  if (offset === todayOffset()) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "Today";
    $("date").append(badge);
  }
  // One span per letter, so the title can be revealed letter by letter.
  $("title").replaceChildren(...[...verse.word].map((ch) => {
    const span = document.createElement("span");
    span.className = "ch";
    span.textContent = ch === " " ? " " : ch;
    return span;
  }));
  $("title").setAttribute("aria-label", verse.word);
  $("verseRef").textContent = verse.ref;
  // The verse: an optional hanging quotation mark, a gold initial, then the rest. The text
  // content stays the plain verse, so copying, the ghost copies and screen readers read it whole.
  const text = displayText(verse);
  const quote = /^[“‘]/.test(text) ? text[0] : "";
  const parts = [];
  if (quote) {
    const q = document.createElement("span");
    q.className = "q";
    q.textContent = quote;
    parts.push(q);
  }
  const initial = document.createElement("span");
  initial.className = "initial";
  initial.textContent = text[quote.length];
  parts.push(initial, text.slice(quote.length + 1));
  $("verseText").replaceChildren(...parts);
  $("translation").textContent = DATA.translation;
  $("today").disabled = offset === todayOffset();
  fitCaption();
  fitTitle();
  for (const [id, delta, word] of [["prev", -1, "Previous"], ["next", 1, "Next"]]) {
    const label = `${word}: ${dateText(offset + delta)} · ${verseFor(offset + delta).ref}`;
    $(id).title = `${label} (${delta < 0 ? "←" : "→"})`;
    $(id).setAttribute("aria-label", label);
    $(`${id}Label`).textContent = shortDate(offset + delta);
  }
  // Remember the day being viewed, so reloading the page keeps your place.
  history.replaceState(null, "", `#${isoDate(offset)}`);
  if ($("drawer").classList.contains("open")) fillDrawer();
}

// A verse that continues a sentence (e.g. Proverbs 3:6 "in all your ways...") is shown
// starting with a capital, as verse-of-the-day pages do, so the initial reads correctly.
// A quotation that started or ends in a neighbouring verse is closed or opened here, so a
// verse shown on its own (e.g. Joshua 24:15) never has a stray quotation mark.
function displayText(verse) {
  let text = verse.text;
  const opens = (text.match(/“/g) || []).length;
  const closes = (text.match(/”/g) || []).length;
  if (closes > opens) text = "“" + text;
  else if (opens > closes) text = text + "”";
  return text.replace(/^([“"‘']?)(\p{Ll})/u, (_, quote, letter) => quote + letter.toUpperCase());
}

const isPortrait = () => window.innerWidth < window.innerHeight || window.innerWidth <= 700;

// Size the verse to its space (40% of the height, 30% on phones): short verses grow so they
// stay the centrepiece (up to 1.4×, 1.2× on phones), long passages shrink (down to 0.6×).
function fitCaption() {
  const caption = $("caption");
  const portrait = isPortrait();
  const limit = window.innerHeight * (portrait ? 0.3 : 0.4);
  let scale = portrait ? 1.2 : 1.4;
  caption.style.setProperty("--ts", scale);
  while (caption.offsetHeight > limit && scale > 0.6) {
    scale -= 0.05;
    caption.style.setProperty("--ts", scale);
  }
}

// Long title words (up to "NOTHING TOO HARD"): shrink until the word fits its column.
// It measures the letters themselves, not the block (whose negative margin always overflows).
function fitTitle() {
  const title = $("title");
  const maxW = isPortrait() ? window.innerWidth - 40 : window.innerWidth * 0.4;
  const letters = document.createRange();
  letters.selectNodeContents(title);
  let tw = 1;
  title.style.setProperty("--tw", tw);
  while (letters.getBoundingClientRect().width > maxW && tw > 0.45) {
    tw -= 0.05;
    title.style.setProperty("--tw", tw);
  }
}

// Each verse gets its own sky: a steady 0..1 value from its reference.
function moodFor(verse) {
  let h = 0;
  for (const ch of verse.ref) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return (h % 1000) / 1000;
}

function fillDrawer() {
  const verse = verseFor(offset);
  const body = $("drawerBody");
  body.innerHTML = "";
  const add = (tag, text, cls) => {
    const el = document.createElement(tag);
    el.textContent = text;
    if (cls) el.className = cls;
    body.append(el);
    return el;
  };
  add("h2", verse.ref);
  if (verse.context && verse.context.length) {
    add("h3", "The passage");
    const p = add("p", "");
    const [first, last] = verse.range;
    for (const [n, text] of verse.context) {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = n;
      const line = document.createElement("span");
      if (n >= first && n <= last) line.className = "here";
      line.textContent = text;
      p.append(num, line, " ");
    }
  }
  const notes = DATA.notes[verse.ref];
  if (notes) {
    add("h3", "Universal wisdom"); add("p", notes.wisdom);
    add("h3", "Historical context"); add("p", notes.context);
    add("h3", "Theological meaning"); add("p", notes.meaning);
  }
  const book = DATA.books[verse.book];
  if (book) {
    add("h3", `About ${verse.book === "Psalm" ? "Psalms" : verse.book}`);
    add("p", book.about);
    add("p", `Author: ${book.author}.`);
    add("p", `Date: ${book.date}.`);
  }
}

function toggleDrawer(open = !$("drawer").classList.contains("open")) {
  if (open) fillDrawer();
  $("drawer").classList.toggle("open", open);
  $("contextBtn").setAttribute("aria-pressed", String(open));
}

// ---------- Drawing ----------

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function makeMaskCanvas(img) {
  const w = 1024, h = Math.round(1024 * img.height / img.width);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  ctx.filter = `blur(${w * 0.018}px)`;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  // Push points on the artwork's border slightly outside so the blur doesn't fade them.
  const out = (v) => (v <= 0 ? -0.05 : v >= 1 ? 1.05 : v);
  FIGURE.forEach(([x, y], i) => ctx[i ? "lineTo" : "moveTo"](out(x) * w, out(y) * h));
  ctx.closePath();
  ctx.fill();
  return c;
}

// Where the woodcut sits: standing on the bottom edge, a little right of centre on wide screens.
function figureRect(width, height, imgAspect) {
  if (width < height) {
    // Portrait (phones): bigger, cropped at the sides, centred on Jesus and Peter,
    // and standing above the verse caption instead of hidden behind it.
    const figH = Math.min(0.56 * height, (1.4 * width) / imgAspect);
    const figW = figH * imgAspect;
    const bottom = 0.70 * height;
    return [(0.5 * width - 0.46 * figW) / width, (bottom - figH) / height, figW / width, figH / height];
  }
  const figH = Math.min(0.84 * height, (0.98 * width) / imgAspect);
  const figW = figH * imgAspect;
  const centre = width / height > 1.15 ? 0.63 * width : 0.5 * width;
  const x0 = Math.min(Math.max(centre - figW / 2, 0), width - figW);
  return [x0 / width, (height - figH) / height, figW / width, figH / height];
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function texture(gl, unit, source, mipmaps) {
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (mipmaps) {
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  return tex;
}

// Set up by start(); the controls call these.
let scene = { splash() {}, togglePause() {}, travel() {} };
let artImage = null;   // the decoded woodcut, shared with the share card
let frozenTravel = null;   // testing only: a fixed transition progress (0..1)

function showStatic() {
  document.body.classList.add("static");
  $("fallbackImg").src = DATA.image;
  $("scene").style.display = "none";
  $("hint").textContent = "Arrow keys change the day · C for context";
}

async function loadFonts() {
  for (const [family, uri] of [["EB Garamond", DATA.fonts.garamond], ["Cormorant Garamond", DATA.fonts.cormorant]]) {
    document.fonts.add(await new FontFace(family, `url(${uri})`, { weight: "300 800" }).load());
  }
}

async function start() {
  await loadFonts();
  fillText();

  const img = artImage = await loadImage(DATA.image);
  const canvas = $("scene");
  // preserveDrawingBuffer keeps a frozen frame on screen between redraws.
  const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) return showStatic();

  let program;
  try {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  } catch (err) {
    console.error(err);
    return showStatic();
  }
  gl.useProgram(program);

  // One triangle that covers the whole canvas.
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const u = (name) => gl.getUniformLocation(program, name);
  const imgAspect = img.width / img.height;
  texture(gl, 0, img, true);
  texture(gl, 1, makeMaskCanvas(img), false);
  gl.uniform1i(u("uImage"), 0);
  gl.uniform1i(u("uMask"), 1);
  gl.uniform1f(u("uGrain"), PARAMS.has("nograin") ? 0 : 1);

  // A clock that stops while paused, so the waves and splashes freeze together.
  const fixedTime = PARAMS.has("t") ? Number(PARAMS.get("t")) : null;
  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let still = fixedTime !== null || motionQuery.matches;
  const fullHint = $("hint").textContent;
  const updateHint = () => {
    // With motion off the water doesn't ripple and there's nothing to pause.
    $("hint").textContent = motionQuery.matches ? "Arrow keys change the day · C for context" : fullHint;
  };
  updateHint();
  let paused = false;
  let clock = fixedTime ?? 0;
  let last = performance.now();

  const ripples = new Float32Array(MAX_RIPPLES * 4);
  let nextRipple = 0;
  let horizon = 0.4;
  let figBase = [0, 0, 1, 1];

  // Travel between verses: an eased glide from one scene position (and sky mood) to the next.
  const travelState = { from: 0, to: 0, moodFrom: moodFor(verseFor(offset)), moodTo: moodFor(verseFor(offset)), dir: 1, start: -Infinity };
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  function travelUniforms(now) {
    const s = travelState;
    let p = still ? 1 : Math.min(Math.max((now - s.start) / TRAVEL_MS, 0), 1);
    if (frozenTravel !== null) p = frozenTravel;     // testing: hold the scene mid-transition
    const e = easeInOut(p);
    const pulse = p < 1 ? Math.sin(p * Math.PI) : 0;
    gl.uniform1f(u("uTravel"), s.from + (s.to - s.from) * e);
    gl.uniform1f(u("uMood"), s.moodFrom + (s.moodTo - s.moodFrom) * e);
    gl.uniform1f(u("uPulse"), pulse);
    gl.uniform1f(u("uProgress"), p);
    gl.uniform1f(u("uDir"), s.dir);
    // The figures lean very slightly against the direction of travel, then settle.
    const [x, y, w, h] = figBase;
    const grow = 1 + (s.dir > 0 ? 0.018 : -0.012) * pulse;
    gl.uniform4f(u("uFig"), x - s.dir * 0.01 * pulse - (w * (grow - 1)) / 2, y - h * (grow - 1), w * grow, h * grow);
  }

  const draw = (now = performance.now()) => {
    gl.uniform1f(u("uTime"), clock);
    gl.uniform4fv(u("uRipples"), ripples);
    travelUniforms(now);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  function travel(dir) {
    const s = travelState;
    const now = performance.now();
    const p = Math.min(Math.max((now - s.start) / TRAVEL_MS, 0), 1);
    // Start from wherever the scene is right now, so rapid clicks never jump.
    s.from = s.from + (s.to - s.from) * easeInOut(p);
    s.moodFrom = s.moodFrom + (s.moodTo - s.moodFrom) * easeInOut(p);
    s.to = s.from + dir;
    s.moodTo = moodFor(verseFor(offset));
    s.dir = dir;
    s.start = now;
    if (still) draw(now);
  }

  function resize() {
    // ?lowres (testing) draws the sea at a third of the size, for slow software renderers.
    const dpr = PARAMS.has("lowres") ? 0.33 : Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u("uRes"), canvas.width, canvas.height);
    gl.uniform1f(u("uDpr"), dpr);
    const fig = figureRect(canvas.width, canvas.height, imgAspect);
    figBase = fig;
    // Line the drawn horizon up with the horizon inside the woodcut.
    horizon = fig[1] + ART_HORIZON * fig[3];
    gl.uniform1f(u("uHorizon"), horizon);
    gl.uniform2f(u("uSun"), fig[0] + JESUS_HEAD[0] * fig[2], fig[1] + JESUS_HEAD[1] * fig[3]);
    fitCaption();
    fitTitle();
    // Resizing clears the canvas, so a frozen scene must be redrawn here.
    if (still || paused) draw();
  }

  function splash(clientX, clientY, strength) {
    if (still) return;
    ripples.set([clientX / window.innerWidth, clientY / window.innerHeight, clock, strength], nextRipple * 4);
    nextRipple = (nextRipple + 1) % MAX_RIPPLES;
    $("hint").classList.add("gone");
    if (paused) draw();
  }

  function togglePause() {
    if (still) return;
    paused = !paused;
    last = performance.now();
  }

  scene = { splash, togglePause, travel };
  if (PARAMS.has("ripple")) {
    const [x, y] = PARAMS.get("ripple").split(",").map(Number);
    ripples.set([x, y, (fixedTime ?? 0) - 0.5, 1], 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // Clicks make a big splash; moving across the water leaves small rings.
  let lastWake = 0;
  canvas.addEventListener("pointerdown", (e) => splash(e.clientX, e.clientY, 1.0));
  canvas.addEventListener("pointermove", (e) => {
    const now = performance.now();
    if (now - lastWake > 220 && e.clientY / window.innerHeight > horizon) {
      lastWake = now;
      splash(e.clientX, e.clientY, e.buttons ? 0.7 : 0.3);
    }
  });

  let rafId = 0;
  const startLoop = () => {
    last = performance.now();
    const frame = (now) => {
      if (!paused) clock += Math.min(now - last, 100) / 1000;
      last = now;
      draw(now);
      rafId = requestAnimationFrame(frame);
    };
    rafId = requestAnimationFrame(frame);
  };
  if (!still) startLoop();
  // Turning "reduce motion" on or off while the page is open takes effect straight away.
  if (fixedTime === null) {
    motionQuery.addEventListener("change", () => {
      updateHint();
      if (motionQuery.matches) {
        still = true;
        cancelAnimationFrame(rafId);
        travelState.start = -Infinity;       // any camera move in progress snaps to its end
        draw();
      } else {
        still = false;
        paused = false;
        startLoop();
      }
    });
  }
}

// ---------- Moving between verses ----------
//
// The day changes immediately (so Context, Share and the address always match what
// you're reading); only the visuals animate. The outgoing title and caption are
// copied into "ghost" layers that fade away while the real ones reveal the new verse.

const reducedMotion = () =>
  window.matchMedia("(prefers-reduced-motion: reduce)").matches || PARAMS.has("t");
let transition = { animations: [], ghosts: [], timer: 0, startedAt: -Infinity };
const SAFETY_MS = 1900;

function settleTransition() {
  clearTimeout(transition.timer);
  for (const a of transition.animations) a.finish();
  for (const g of transition.ghosts) g.remove();
  transition = { animations: [], ghosts: [], timer: 0, startedAt: -Infinity };
}

// A second click early in a transition: keep the words the reader is still looking at (the
// outgoing copies) and carry on fading them from where they are, instead of flashing up the
// half-revealed in-between verse. Returns the reused copies, or null.
function reuseGhosts() {
  const t = transition;
  if (t.ghosts.length !== 2 || performance.now() - t.startedAt > 500 || reducedMotion()) return null;
  clearTimeout(t.timer);
  for (const g of t.ghosts) {
    for (const a of g.getAnimations({ subtree: true })) { a.commitStyles(); a.cancel(); }
  }
  for (const a of t.animations) if (a.playState !== "idle") a.finish();
  const ghosts = t.ghosts;
  transition = { animations: [], ghosts: [], timer: 0, startedAt: -Infinity };
  return ghosts;
}

function ghostOf(el) {
  const ghost = el.cloneNode(true);
  ghost.removeAttribute("id");
  ghost.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
  ghost.classList.add("ghost");
  ghost.setAttribute("aria-hidden", "true");
  document.body.append(ghost);
  return ghost;
}

function go(newOffset) {
  if (newOffset === offset) return;
  const dir = Math.sign(newOffset - offset);
  const heading = document.querySelector(".heading:not(.ghost)");
  const caption = $("caption");
  let ghosts = reuseGhosts();
  if (!ghosts) {
    // If the previous verse is still being revealed, copy it as it looks right now
    // (partly revealed), not fully shown, so a later second click never flashes it.
    const live = [heading, caption];
    const touched = [];
    for (const a of transition.animations) {
      const el = a.effect && a.effect.target;
      if (el && live.some((root) => root.contains(el)) && a.playState !== "finished") {
        a.commitStyles();
        touched.push(el);
      }
    }
    ghosts = live.map(ghostOf);
    settleTransition();                        // finish any earlier transition instantly
    for (const el of touched) for (const prop of ["opacity", "transform", "filter", "clip-path"]) el.style.removeProperty(prop);
  }
  offset = newOffset;
  fillText();
  scene.travel(dir);

  const anims = [];
  const play = (el, keyframes, options) => anims.push(el.animate(keyframes, { fill: "backwards", ...options }));

  if (reducedMotion()) {
    // A short, motion-free crossfade.
    play(ghosts[0], [{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: "forwards" });
    play(ghosts[1], [{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: "forwards" });
    play(heading, [{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
    play(caption, [{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
  } else {
    const ease = "cubic-bezier(0.22, 0.61, 0.36, 1)";
    // Forward: the old title passes by the viewer as the new one rises out of the depth.
    // Backward: the old title recedes into the depth as the previous one comes back forward.
    // The old title is gone (420 ms) before the new letters gain weight (from 360 ms), so the
    // two words never blend into one. Keyframes start from the copy's current look, which is
    // the resting state normally, or mid-fade when a reused copy carries on after a quick second click.
    play(ghosts[0], [
      { opacity: 0, transform: `translate3d(${-dir * 2}vw, -0.5vh, 0) scale(${dir > 0 ? 1.12 : 0.88})`, filter: "blur(7px)" },
    ], { duration: 420, easing: "cubic-bezier(0.4, 0, 0.6, 1)", fill: "forwards" });
    const ghostDate = ghosts[0].querySelector(".date");
    if (ghostDate) play(ghostDate, [{ opacity: 0 }], { duration: 150, easing: "ease-in", fill: "forwards" });
    const letters = [...$("title").children];
    const stagger = Math.min(44, 520 / Math.max(letters.length, 1));
    letters.forEach((letter, i) => {
      const order = dir > 0 ? i : letters.length - 1 - i;     // letters arrive in the direction of travel
      play(letter, [
        { opacity: 0, transform: `translateY(0.16em) scale(${dir > 0 ? 0.8 : 1.2})`, filter: "blur(9px)" },
        { opacity: 1, transform: "none", filter: "blur(0)" },
      ], { duration: 760, delay: 360 + order * stagger, easing: ease });
    });
    play($("date"), [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 220 });
    // A rack focus that drifts with the camera: the old verse is gone before the new one
    // resolves, so two passages never overlap.
    play(ghosts[1], [
      { opacity: 0, transform: `translate3d(${-dir * 12}px, -6px, 0)`, filter: "blur(3px)" },
    ], { duration: 240, easing: "ease-in", fill: "forwards" });
    play(caption, [
      { opacity: 0, transform: `translate3d(${dir * 16}px, 10px, 0)`, filter: "blur(4px)" },
      { opacity: 1, transform: "none", filter: "blur(0)" },
    ], { duration: 680, delay: 300, easing: "cubic-bezier(0.16, 1, 0.3, 1)" });
    play($("verseRef"), [
      { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0 0 0)" },
    ], { duration: 640, delay: 480, easing: ease });
    if ($("drawer").classList.contains("open")) {
      play($("drawerBody"), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
    }
  }
  for (const g of ghosts) g.getAnimations().forEach((a) => a.finished.then(() => g.remove(), () => {}));
  // Safety net: if the browser stalls (a busy or backgrounded tab), still end on the
  // finished state, so the new title never stays invisible.
  const timer = setTimeout(settleTransition, SAFETY_MS);
  transition = { animations: anims, ghosts, timer, startedAt: performance.now() };
}

// ---------- Sharing: always the verse on screen ----------

const currentVerse = () => verseFor(offset);
const shareText = (verse = currentVerse()) => {
  const text = displayText(verse);
  const quoted = /^[“‘]/.test(text) ? text : `“${text}”`;   // don't double up quotation marks
  return `${quoted} — ${verse.ref} (${DATA.translation})`;
};

let toastTimer = 0;
function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
}

function copyWithSelection(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.append(area);
  area.select();
  const ok = document.execCommand("copy");
  area.remove();
  return ok;
}

async function copyVerse() {
  const verse = currentVerse();
  const text = shareText(verse);
  let copied = false;
  try {
    // A page opened from a file can leave the clipboard request waiting for permission,
    // so don't wait on it for long.
    await Promise.race([
      navigator.clipboard.writeText(text),
      new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 800)),
    ]);
    copied = true;
  } catch {
    copied = copyWithSelection(text);
  }
  toast(copied ? `Copied ${verse.ref}` : `Couldn't copy. Select the verse text to copy ${verse.ref}`);
}

function wrapLines(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const word of text.split(/\s+/)) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Draws text with letter-spacing, character by character where ctx.letterSpacing is missing.
function trackedText(ctx, text, x, y, spacingPx, align = "left") {
  if ("letterSpacing" in ctx) {
    ctx.save();
    ctx.letterSpacing = `${spacingPx}px`;
    ctx.textAlign = align;
    ctx.fillText(text, align === "right" ? x + spacingPx : x, y);   // trailing space would shift right-aligned text
    ctx.restore();
    return;
  }
  const chars = [...text];
  const width = chars.reduce((w, ch) => w + ctx.measureText(ch).width + spacingPx, -spacingPx);
  let cx = align === "right" ? x - width : x;
  ctx.save();
  ctx.textAlign = "left";
  for (const ch of chars) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacingPx; }
  ctx.restore();
}

function trackedWidth(ctx, text, spacingPx) {
  return [...text].reduce((w, ch) => w + ctx.measureText(ch).width + spacingPx, -spacingPx);
}

// A 1080×1350 share card: a dark gallery print of the verse on screen, drawn in 2D
// (never read from the WebGL canvas, so transitions and ripples can't leak into it).
async function shareCard(verse = currentVerse(), offsetDays = offset) {
  const W = 1080, H = 1350, M = 88;
  const NIGHT = "#0b0a0b", BONE = "#efe6d2", GOLD = "#d4a24c", CRIMSON = "#8a2a22";
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);

  // 1. The woodcut, lamplit from Jesus' head and falling into night.
  const img = artImage ?? (artImage = await loadImage(DATA.image));
  const PIC_H = 860;
  const sx = img.width * 0.08, sw = img.width * 0.86, sh = sw * (PIC_H / W);
  const pic = document.createElement("canvas");
  pic.width = W; pic.height = PIC_H;
  const p = pic.getContext("2d");
  p.filter = "grayscale(1) contrast(1.12)";
  p.drawImage(img, sx, 0, sw, sh, 0, 0, W, PIC_H);
  p.filter = "none";
  const head = { x: ((JESUS_HEAD[0] * img.width - sx) / sw) * W, y: ((JESUS_HEAD[1] * img.height) / sh) * PIC_H };
  p.globalCompositeOperation = "multiply";
  // A tight lamp: Jesus and Peter lit, the woodcut's own daytime sky falling into night.
  const lamp = p.createRadialGradient(head.x, head.y + 60, 0, head.x, head.y + 60, 620);
  lamp.addColorStop(0, "#fbf1d8");
  lamp.addColorStop(0.2, "#e9c98a");
  lamp.addColorStop(0.45, "#6b5030");
  lamp.addColorStop(0.7, "#1c1612");
  lamp.addColorStop(1, NIGHT);
  p.fillStyle = lamp;
  p.fillRect(0, 0, W, PIC_H);
  p.globalCompositeOperation = "screen";
  const bloom = p.createRadialGradient(head.x, head.y, 0, head.x, head.y, 260);
  bloom.addColorStop(0, "rgba(255,226,170,0.35)");
  bloom.addColorStop(1, "rgba(255,226,170,0)");
  p.fillStyle = bloom;
  p.fillRect(0, 0, W, PIC_H);
  const streak = p.createLinearGradient(0, 0, W, 0);
  streak.addColorStop(0, "rgba(219,143,61,0)");
  streak.addColorStop(Math.min(Math.max(head.x / W, 0.05), 0.95), "rgba(219,143,61,0.22)");
  streak.addColorStop(1, "rgba(219,143,61,0)");
  p.fillStyle = streak;
  p.fillRect(0, head.y - 3, W, 6);
  // The picture stays inside the hairline frame.
  ctx.save();
  ctx.beginPath();
  ctx.rect(37, 37, W - 74, H - 74);
  ctx.clip();
  ctx.drawImage(pic, 0, 0);

  // 2. Fade the picture into the night, and a vignette.
  const fade = ctx.createLinearGradient(0, 520, 0, PIC_H);
  fade.addColorStop(0, "rgba(11,10,11,0)");
  fade.addColorStop(1, NIGHT);
  ctx.fillStyle = fade;
  ctx.fillRect(0, 520, W, PIC_H - 520 + 1);
  ctx.restore();
  const vig = ctx.createRadialGradient(W * 0.45, H * 0.4, 0, W * 0.45, H * 0.4, Math.hypot(W, H) * 0.62);
  vig.addColorStop(0.55, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // 3. The text, laid out from the bottom up.
  ctx.textBaseline = "alphabetic";
  const footerY = H - 72;
  ctx.font = `500 19px "EB Garamond"`;
  // Shorten the translation name if a long date would crowd "VERSE-AI".
  let footer = `${dateText(offsetDays)} · ${DATA.translation}`.toUpperCase();
  if (M + trackedWidth(ctx, footer, 4) > W - M - trackedWidth(ctx, "VERSE-AI", 4) - 64) {
    footer = `${dateText(offsetDays)} · BSB`.toUpperCase();
  }
  ctx.fillStyle = "#b9a98c";
  trackedText(ctx, footer, M, footerY, 4);
  ctx.fillStyle = "#a09382";
  trackedText(ctx, "VERSE-AI", W - M, footerY, 4, "right");

  const refY = footerY - 92;
  ctx.fillStyle = CRIMSON;
  ctx.fillRect(M, refY - 9, 56, 1.5);
  ctx.font = `500 26px "EB Garamond"`;
  ctx.fillStyle = GOLD;
  trackedText(ctx, verse.ref.toUpperCase(), M + 56 + 22, refY, 7);

  // The verse, fitted to the space, with a gold initial. An opening quotation mark hangs in
  // the margin so it doesn't widen the initial's indent.
  const text = displayText(verse);
  const quote = text[0] === "“" ? "“" : "";
  const first = text[quote.length];
  const rest = text.slice(quote.length + 1);
  const layout = (size, lines) => {
    // Size the initial from the fonts' real cap heights so it spans exactly `lines` lines.
    ctx.font = `400 ${size}px "EB Garamond"`;
    const boneCap = ctx.measureText("H").actualBoundingBoxAscent;
    ctx.font = `500 100px "Cormorant Garamond"`;
    const cap100 = ctx.measureText(first).actualBoundingBoxAscent || 63;
    const capPx = (100 * ((lines - 1) * size * 1.4 + boneCap)) / cap100;
    ctx.font = `500 ${capPx}px "Cormorant Garamond"`;
    const capW = ctx.measureText(first).width + size * 0.3;
    ctx.font = `400 ${size}px "EB Garamond"`;
    const rows = [];
    let line = "";
    for (const word of rest.split(/\s+/)) {
      const width = W - 2 * M - (rows.length < lines ? capW : 0);
      const test = line ? `${line} ${word}` : word;
      if (ctx.measureText(test).width > width && line) { rows.push(line); line = word; }
      else line = test;
    }
    if (line) rows.push(line);
    return { size, lines, capPx, capW, rows, height: Math.max(rows.length, lines) * size * 1.4 };
  };
  let fit = layout(50, 2);
  for (let size = 50; size >= 28; size -= 2) {
    fit = layout(size, 2);
    if (fit.height <= 330 || (size <= 32 && fit.height <= 420)) break;
  }
  if (fit.rows.length === 1) {
    // A one-line verse: the first letter is simply gold, in line with the rest of the text.
    ctx.font = `400 ${fit.size}px "EB Garamond"`;
    fit = { ...fit, lines: 1, inline: true, capW: ctx.measureText(first).width, height: fit.size * 1.4 };
  }
  const lineH = fit.size * 1.4;
  const verseBottom = refY - 64;
  const verseTop = verseBottom - fit.height;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 18;
  ctx.font = `400 ${fit.size}px "EB Garamond"`;
  ctx.fillStyle = BONE;
  fit.rows.forEach((row, i) => ctx.fillText(row, M + (i < fit.lines ? fit.capW : 0), verseTop + fit.size + i * lineH));
  ctx.restore();
  ctx.save();
  ctx.shadowColor = "rgba(212,162,76,0.4)";
  ctx.shadowBlur = 28;
  ctx.fillStyle = "#f1d79a";
  if (quote) {
    ctx.font = `500 ${fit.size * 1.3}px "Cormorant Garamond"`;
    ctx.fillText(quote, M - ctx.measureText(quote).width - 6, verseTop + fit.size);
  }
  if (fit.inline) {
    ctx.font = `400 ${fit.size}px "EB Garamond"`;
    ctx.fillText(first, M, verseTop + fit.size);
  } else {
    ctx.font = `500 ${fit.capPx}px "Cormorant Garamond"`;
    ctx.fillText(first, M - fit.size * 0.04, verseTop + fit.size + (fit.lines - 1) * lineH);   // sits on the last cap line
  }
  ctx.restore();

  // The title word in gold leaf, with a crimson-and-gold rule beneath it.
  const titleY = verseTop - 56 - 24 - 6;
  let tSize = 104;
  ctx.font = `500 ${tSize}px "Cormorant Garamond"`;
  while (trackedWidth(ctx, verse.word, tSize * 0.2) > W - 2 * M && tSize > 56) ctx.font = `500 ${(tSize -= 4)}px "Cormorant Garamond"`;
  // A soft pool of shadow behind the title, for long verses that lift it onto the engraving.
  const titleW = trackedWidth(ctx, verse.word, tSize * 0.2);
  ctx.save();
  ctx.translate(M + titleW / 2, titleY - tSize * 0.35);
  ctx.scale(1, 0.42);
  const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, titleW * 0.75 + 80);
  pool.addColorStop(0, "rgba(11,10,11,0.72)");
  pool.addColorStop(0.6, "rgba(11,10,11,0.45)");
  pool.addColorStop(1, "rgba(11,10,11,0)");
  ctx.fillStyle = pool;
  ctx.fillRect(-W, -W, 2 * W, 2 * W);
  ctx.restore();
  ctx.font = `500 ${tSize}px "Cormorant Garamond"`;
  const gilt = ctx.createLinearGradient(0, titleY - tSize * 0.72, 0, titleY);
  gilt.addColorStop(0, "#f1d79a");
  gilt.addColorStop(0.58, GOLD);
  gilt.addColorStop(1, "#9c7433");
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.6)";
  ctx.shadowBlur = 14;
  ctx.fillStyle = gilt;
  trackedText(ctx, verse.word, M, titleY, tSize * 0.2);
  ctx.restore();
  ctx.fillStyle = CRIMSON;
  ctx.fillRect(M, titleY + 24, 28, 1);
  const rule = ctx.createLinearGradient(M + 28, 0, M + 300, 0);
  rule.addColorStop(0, GOLD);
  rule.addColorStop(1, "rgba(212,162,76,0)");
  ctx.fillStyle = rule;
  ctx.fillRect(M + 28, titleY + 24, 272, 1);

  // 4. A single hairline passe-partout, and fine grain.
  ctx.strokeStyle = "rgba(212,162,76,0.32)";
  ctx.lineWidth = 1;
  ctx.strokeRect(36.5, 36.5, W - 73, H - 73);
  const noise = document.createElement("canvas");
  noise.width = noise.height = 128;
  const n = noise.getContext("2d");
  const grain = n.createImageData(128, 128);
  for (let i = 0; i < grain.data.length; i += 4) {
    const g = Math.floor(Math.random() * 256);
    grain.data[i] = grain.data[i + 1] = grain.data[i + 2] = g;
    grain.data[i + 3] = 255;
  }
  n.putImageData(grain, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = ctx.createPattern(noise, "repeat");
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  return c;
}

async function saveImage() {
  const verse = currentVerse();
  const card = await shareCard(verse, offset);
  const blob = await new Promise((resolve) => card.toBlob(resolve, "image/png"));
  const name = `verse-ai-${verse.ref.replace(/[^A-Za-z0-9]+/g, "-")}-${isoDate(offset)}.png`;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  toast(`Saved ${name}`);
}

async function nativeShare() {
  const verse = currentVerse();
  const card = await shareCard(verse, offset);
  const blob = await new Promise((resolve) => card.toBlob(resolve, "image/png"));
  const file = new File([blob], "verse.png", { type: "image/png" });
  const data = { title: verse.ref, text: shareText(verse) };
  try {
    await navigator.share(navigator.canShare?.({ files: [file] }) ? { ...data, files: [file] } : data);
  } catch (err) {
    if (err.name !== "AbortError") copyVerse();
  }
}

function toggleMenu(open = $("shareMenu").hidden) {
  $("shareMenu").hidden = !open;
  $("shareBtn").setAttribute("aria-expanded", String(open));
  if (open) $("copyVerse").focus();
}

// ---------- Controls ----------

let lastRepeat = 0;

function isTyping(target) {
  return target instanceof Element && !!target.closest("input, textarea, select, [contenteditable='true']");
}

function wireControls() {
  $("prev").addEventListener("click", () => go(offset - 1));
  $("next").addEventListener("click", () => go(offset + 1));
  $("today").addEventListener("click", () => go(todayOffset()));
  $("contextBtn").addEventListener("click", () => toggleDrawer());
  $("closeDrawer").addEventListener("click", () => toggleDrawer(false));
  $("shareBtn").addEventListener("click", () => toggleMenu());
  $("copyVerse").addEventListener("click", () => { toggleMenu(false); copyVerse(); });
  $("saveImage").addEventListener("click", () => { toggleMenu(false); saveImage(); });
  $("nativeShare").hidden = !navigator.share;
  $("nativeShare").addEventListener("click", () => { toggleMenu(false); nativeShare(); });
  document.addEventListener("click", (e) => {
    if (!$("shareMenu").hidden && !e.target.closest(".share")) toggleMenu(false);
  });

  window.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || isTyping(e.target)) return;
    if (e.key === "Escape") {
      if (!$("shareMenu").hidden) { toggleMenu(false); $("shareBtn").focus(); } else toggleDrawer(false);
      return;
    }
    if (!$("shareMenu").hidden) return;          // let the menu use the keyboard
    // A held arrow key steps calmly (about three days a second) instead of strobing.
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && e.repeat && performance.now() - lastRepeat < 320) return;
    if (e.repeat) lastRepeat = performance.now();
    if (e.key === "ArrowLeft") go(offset - 1);
    else if (e.key === "ArrowRight") go(offset + 1);
    else if (e.key === "t" || e.key === "T" || e.key === "Home") go(todayOffset());
    else if (e.key === "c" || e.key === "C") toggleDrawer();
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); scene.togglePause(); }
    else return;
  });

  // Editing the #date in the address (or using browser history) moves to that day.
  window.addEventListener("hashchange", () => {
    const m = location.hash.match(/^#(\d{4}-\d{2}-\d{2})$/);
    if (m) go(offsetForIso(m[1]));
  });

  // Touchscreens: swipe left for the next verse, right for the previous one.
  let touch = null;
  window.addEventListener("pointerdown", (e) => {
    touch = e.pointerType === "touch" && !e.target.closest(".drawer, .controls, .caption") ? { x: e.clientX, y: e.clientY } : null;
  });
  window.addEventListener("pointerup", (e) => {
    if (!touch) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 60) go(offset + (dx < 0 ? 1 : -1));
  });
}

// Small hooks used by the automated browser tests.
window.verseAI = {
  ready: false,
  state: () => ({
    offset,
    todayOffset: todayOffset(),
    iso: isoDate(offset),
    ref: currentVerse().ref,
    word: currentVerse().word,
    shownRef: $("verseRef").textContent,
    shownText: $("verseText").textContent,
    shownTitle: $("title").getAttribute("aria-label"),
    shownDate: $("date").textContent,
    drawerRef: $("drawerBody").querySelector("h2")?.textContent ?? null,
    shareText: shareText(),
    ghosts: document.querySelectorAll(".ghost").length,
    hash: location.hash,
  }),
  verseFor: (o) => verseFor(o).ref,
  shareCard: async () => (await shareCard()).toDataURL("image/png"),
  // Hold every animation (text and scene) at `ms` into the current transition, or release with null.
  freezeAt: (ms) => {
    frozenTravel = ms === null ? null : Math.min(ms / TRAVEL_MS, 1);
    // Hold the safety net too, or a slow renderer would settle the transition mid-filmstrip.
    clearTimeout(transition.timer);
    if (ms === null && transition.ghosts.length) transition.timer = setTimeout(settleTransition, SAFETY_MS);
    for (const a of document.getAnimations()) {
      if (ms === null) a.play();
      else { a.pause(); a.currentTime = ms; }
    }
  },
};

if (DATA) {
  // Reopen on the day in the address (#YYYY-MM-DD), if there is one. Otherwise, a page
  // built for "today" that is opened on a later day moves on to the real today.
  const fromHash = location.hash.match(/^#(\d{4}-\d{2}-\d{2})$/);
  if (fromHash) offset = offsetForIso(fromHash[1]);
  else if (DATA.startIsToday) offset = todayOffset();
  wireControls();
  if (PARAMS.has("panel")) document.fonts.ready.then(() => toggleDrawer(true));
  start()
    .catch((err) => { console.error(err); showStatic(); fillText(); })
    .finally(() => { window.verseAI.ready = true; });
} else {
  document.body.textContent = "Open this through visual.py, which fills in today's verse.";
}
</script>
</body>
